- name: Set defaults for {{ app_defaults_config.settings_var_name }} in {{ app_defaults_config.domain }}
  command: "defaults write {{ app_defaults_config.domain }} {{ item.key }} {{ item.value }}"
  loop: "{{ lookup('vars', app_defaults_config.settings_var_name) | dict2items }}"
  when: item.value is defined and item.value | string != (lookup('pipe', 'defaults read ' + app_defaults_config.domain + ' ' + item.key)) | string