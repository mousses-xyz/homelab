- name: Set defaults for {{ defaults_config }}
  osx_defaults:
    domain: defaults_config
    key: item.key
    value: item.value
    state: present
  loop: "{{ lookup('vars', defaults_config) | dict2items }}"
  when:
    - ansible_facts['os_family'] == 'Darwin'
    - item.value is defined
    - item.value | string != (lookup('pipe', 'defaults read ' + defaults_config + ' ' + item.key)) | string