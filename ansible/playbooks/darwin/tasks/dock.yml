---
- name: Remove all dock items
  shell: dockutil --remove all --no-restart
  register: removed_items_task
- name: Check if desired dock items exist and add if nonexistent
  shell: dockutil --find '{{ item.name }}' || dockutil --add '{{ item.path }}'  --no-restart
  with_items: "{{ dock_items }}"
- name: Fix dock items order
  shell: dockutil --move '{{ item.name }}' --position {{ item.pos }}  --no-restart
  with_items: "{{ dock_items }}"
  # TODO: move to left side of screen and add folders
- name: Add folders to Dock
  shell: dockutil --add '{{ item.path }}' --label '{{ item.label }}' --display stack --view fan --no-restart
  with_items: "{{ dock_folders }}"
- name: Restart Dock
  shell: killall Dock
  when: removed_items_task is changed