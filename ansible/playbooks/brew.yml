---
- name: Handle packages for darwin
  hosts: darwin
  tasks:
    - name: Install Homebrew
      homebrew:
        state: latest
    - name: Update Homebrew
      homebrew:
        update_homebrew: true
    - name: Install these latest formulae/casks
      homebrew:
        name: "{{ item }}"
        state: latest
      with_items:
        # Containers/Virtualization
        - docker
        - docker-compose
        - kubectl
        - qemu
        - utm

        # App Development
        - android-platform-tools
        - android-studio
        - flutter
        - gradle 
        - openjdk

        # Other Development tools
        # - anaconda
        - coreutils
        # - firebase-cli
        - git
        - go
        - openssh
        - pkg-config
        - rust-analyzer
        - rustup
        - devcleaner

        # Utilities
        - htop
        - ntp
        - tree 
        - ffmpeg
        - neofetch
        - neovim
        - vim
        - tmux
        - wget
        - yt-dlp
        - zsh

        # Microsoft Stuff
        - microsoft-teams
        - microsoft-outlook
        - microsoft-word
        - microsoft-excel
        - microsoft-powerpoint

        # Other GUI Apps
        - aldente
        - balenaetcher
        - bitwarden
        - brave-browser
        - chatgpt
        - cmatrix
        - font-monocraft
        - libreoffice
        - localsend
        # - minecraft
        # - openvpn
        - signal
        - spotify
        # - steam
        - the-unarchiver
        - unnaturalscrollwheels
        - visual-studio-code
        - vlc
        - zoom
    - name: Update all other outdated formulae/casks
      homebrew:
        state: latest
        upgrade_all: yes
    - name: Install these latest casks
      homebrew_cask:
        name: "{{ item }}"
        state: latest
      with_items:
        - tailscale
        # - avibrazil-rdm
        # - sensible-side-buttons
    - name: Update all other outdated casks
      homebrew_cask:
        state: latest
        upgrade_all: yes