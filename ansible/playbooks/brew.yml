---
- name: Handle packages for darwin
  hosts: darwin
  tasks:
    - name: Install Homebrew
      homebrew:
        state: latest
    - name: Update Homebrew
      homebrew:
        update_homebrew: true
    - name: Install these latest formulae
      homebrew:
        name: "{{ item }}"
        state: latest
      with_items:
        # Terminal setup
        - zsh
        - vim
        - neovim
        - tmux
        # Development tools
        - coreutils
        - git
        - openssh
        - anaconda
        - android-platform-tools 
        - gradle 
        - openjdk
        - node
        - pkg-config
        - rustup 
        - qemu
        - docker
        - docker-compose
        - kubectl
        # Utilities
        - htop
        - ntp
        - tree 
        - ffmpeg
        - wget
        - curl
        # Other
        - yt-dlp
        - neofetch
        - cmatrix
    - name: Update all other outdated formulae
      homebrew:
        state: latest
        upgrade_all: yes
    - name: Install these latest casks
      homebrew_cask:
        name: "{{ item }}"
        state: latest
      with_items:
        - brave-browser
        - tailscale
        - zoom
    - name: Force install these latest casks
      homebrew_cask:
        name: "{{ item }}"
        state: latest
        install_options: force
      with_items:
        - aldente
        - balenaetcher
        - bitwarden
        - font-monocraft
        - google-chrome
        - signal
        - spotify
        # - avibrazil-rdm
        - the-unarchiver
        - unnaturalscrollwheels
        - utm
        - visual-studio-code
    # - name: Force install these latest casks without quarantine
    #   homebrew_cask:
    #     name: "{{ item }}"
    #     state: latest
    #     install_options: force no-quarantine
    #   with_items:
    #     - librewolf
    - name: Update all other outdated casks
      homebrew_cask:
        state: latest
        upgrade_all: yes