---
- name: Handle packages for darwin
  hosts: darwin
  tasks:
    - name: Install Homebrew
      homebrew:
        state: latest
    - name: Update Homebrew
      homebrew:
        update_homebrew: true
    - name: Install these latest formulae/casks
      homebrew:
        name: "{{ item }}"
        state: latest
      with_items:
        # Containers/Virtualization
        - docker
        - docker-compose
        - kubectl
        - qemu
        - utm
        # App Development
        - android-platform-tools
        - android-studio
        - flutter
        - gradle 
        - openjdk
        # Other Development tools
        - coreutils
        - git
        - openssh
        - anaconda
        - pkg-config
        - rustup 
        - go
        # Utilities
        - htop
        - ntp
        - tree 
        - ffmpeg
        - wget
        - curl
        - yt-dlp
        - neofetch
        - zsh
        - vim
        - neovim
        - tmux
        # Other GUI Apps
        - aldente
        - balenaetcher
        - bitwarden
        - brave-browser
        - cmatrix
        - font-monocraft
        - google-chrome
        - libreoffice
        - localsend
        - signal
        - spotify
        - the-unarchiver
        - unnaturalscrollwheels
        - visual-studio-code
        - zoom
    - name: Update all other outdated formulae/casks
      homebrew:
        state: latest
        upgrade_all: yes
    - name: Install these latest casks
      homebrew_cask:
        name: "{{ item }}"
        state: latest
      with_items:
        - tailscale
        # - avibrazil-rdm
    - name: Update all other outdated casks
      homebrew_cask:
        state: latest
        upgrade_all: yes